name: Release Electron App

# Manual-only — nothing fires on tag push. Publishing is always an explicit
# human action. The workflow ALWAYS uses a tag (never silently builds HEAD)
# and ALWAYS errors out when the tag is missing rather than guessing.
#
# Two ways to invoke:
#   - Leave `version` empty → finds the highest-semver tag on origin and uses it.
#     This is the "rebuild whatever's latest" path. Re-running the workflow
#     with empty input always targets the same tag (until you publish a higher
#     one).
#   - Fill `version=1.2.3` (or `v1.2.3`) → uses that specific tag. Used when
#     you want to re-publish an older tag or skip past a newer one.
#
# Prerequisite for either path: the tag must already exist on origin. Tags
# are created by `Set version & tag`. We refuse to auto-create — silent tag
# creation has burned us in the past (release artifacts end up built from
# a commit that the tag doesn't actually point at).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release — "1.2.3" or "v1.2.3". Leave empty to release the highest-semver tag on origin.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    # Force every JavaScript action (checkout / pnpm/action-setup / setup-node)
    # to run on Node 24, clearing the Node 20 deprecation warning. Official
    # GitHub opt-in: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Full history so `git checkout <tag>` and `git ls-remote` both work.
          fetch-depth: 0

      - name: Resolve target tag
        id: resolve
        # Force bash — the windows-latest runner defaults to PowerShell, which
        # can't parse `[ -z "$VAR" ]` / `[[ "$VAR" == v* ]]` etc.
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RAW="$INPUT_VERSION"

          if [ -z "$RAW" ]; then
            # Empty input → pick the highest semver tag on origin.
            #
            # `git ls-remote --tags origin` prints one line per tag:
            #   <sha>\trefs/tags/v1.0.0
            #   <sha>\trefs/tags/v1.0.0^{}    ← peeled (dereferenced) tag, same commit
            # Strip refs/tags/, drop the peeled (^{}) lines, keep only vX.Y.Z,
            # sort by semver, take the highest.

            echo "::debug::Raw \`git ls-remote --tags origin\` output:"
            git ls-remote --tags origin | sed 's/^/  /'

            CANDIDATES="$(
              git ls-remote --tags origin \
                | awk '{print $2}' \
                | sed 's|^refs/tags/||' \
                | grep -v '\^' \
                | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                || true
            )"

            echo "::debug::Tags matching vX.Y.Z (after filters):"
            if [ -z "$CANDIDATES" ]; then
              echo "  (none)"
            else
              echo "$CANDIDATES" | sed 's/^/  /'
            fi

            TAG="$(printf '%s\n' "$CANDIDATES" | sort -V | tail -n 1)"

            if [ -z "$TAG" ]; then
              echo "::error::No semver tag found on origin (looked for vX.Y.Z)."
              echo "::error::Run \`Set version & tag\` first to create one, then re-run this workflow."
              echo "::error::If you know a tag should be on origin, run \`git ls-remote --tags origin\` locally to inspect."
              exit 1
            fi

            echo "No version supplied — picked highest tag on origin: ${TAG}."
          else
            # Explicit input → normalize to a tag, validate, require it to exist.
            if [[ "$RAW" == v* ]]; then
              TAG="$RAW"
              VER="${RAW#v}"
            else
              TAG="v$RAW"
              VER="$RAW"
            fi

            if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'${RAW}' is not a valid semver version (expected X.Y.Z or vX.Y.Z)"
              exit 1
            fi

            echo "::debug::Raw \`git ls-remote --tags origin | grep ${TAG}\`:"
            git ls-remote --tags origin | grep "${TAG}" || echo "  (no match)"

            if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "::error::Tag '${TAG}' does not exist on origin."
              echo "::error::Run \`Set version & tag\` first to create the commit + tag + push,"
              echo "::error::then re-run this workflow with version=${VER} (or empty to pick latest)."
              exit 1
            fi

            echo "Resolved ${RAW} → ${TAG} (exists on origin)."
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        shell: bash
        run: |
          git checkout "${{ steps.resolve.outputs.tag }}"
          echo "Checked out ${{ steps.resolve.outputs.tag }} at $(git rev-parse --short HEAD)."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        # --publish always: create the GitHub Release if missing, overwrite artifacts if it exists.
        shell: bash
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

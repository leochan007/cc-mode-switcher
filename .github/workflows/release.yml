name: Release Electron App

# Manual-only — nothing here fires on tag push. Publishing is always an explicit
# human action: first run `Set version & tag` (creates the commit + tag + push),
# then run this workflow to actually build & publish the GitHub Release.
#
# Inputs:
#   tag — optional. Leave blank to build whatever is currently on main HEAD
#         (i.e. the commit `Set version & tag` just pushed). Fill `vX.Y.Z` to
#         re-publish an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Leave blank to build the current main HEAD.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    # Force every JavaScript action (checkout / pnpm/action-setup / setup-node)
    # to run on Node 24, clearing the Node 20 deprecation warning. Official
    # GitHub opt-in: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Full history so `git checkout <tag>` works when an explicit tag is given.
          fetch-depth: 0

      - name: Checkout explicit tag (re-publish only)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "No explicit tag — building current HEAD $(git rev-parse --short HEAD) on $(git rev-parse --abbrev-ref HEAD)."
          else
            if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "::error::Tag '${TAG}' does not exist on origin."
              exit 1
            fi
            git checkout "$TAG"
            echo "Checked out ${TAG} at $(git rev-parse --short HEAD)."
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and publish
        # --publish always: create the GitHub Release if missing, update artifacts if it exists.
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
